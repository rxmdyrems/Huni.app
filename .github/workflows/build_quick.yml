name: Quick Test Build

# Manual only: on push this built exactly the same FOSS release APK as the
# "Build Release (foss)" job in build.yml, doubling the cost of every push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_quick:
    name: Quick Universal Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK (No Lint)
        run: ./gradlew --console=plain assembleFossRelease --warning-mode summary -x lint -x lintFossRelease
        env:
          METROLIST_APPLICATION_ID: com.remycamiguel.huni
          METROLIST_APP_NAME: Huni
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          # Without these the in-app crash/ANR reporter silently disables itself
          # (CrashReporter.isEnabledSafe), so tester builds report nothing.
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'rxmdyrems/Huni.app' }}

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          KEYSTORE_FILE="$RUNNER_TEMP/huni-release.keystore"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"
          UNSIGNED_APK=$(find app/build/outputs/apk/foss/release -maxdepth 1 -type f -name '*unsigned*.apk' -print -quit)
          test -n "$UNSIGNED_APK"
          SIGNED_APK="${UNSIGNED_APK%-unsigned.apk}-signed.apk"
          "$APKSIGNER" sign --ks "$KEYSTORE_FILE" --ks-pass "pass:$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" --out "$SIGNED_APK" "$UNSIGNED_APK"

      - name: Move signed APK
        run: |
          OUTPUT_DIR="app/build/outputs/apk/foss/release"
          mkdir -p "$OUTPUT_DIR/out"
          find "$OUTPUT_DIR" -name "*-signed.apk" -o -name "*-unsigned-signed.apk" | xargs -I{} mv {} "$OUTPUT_DIR/out/app-universal-test-release.apk"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v6
        with:
          name: app-universal-test-release
          path: app/build/outputs/apk/foss/release/out/*
