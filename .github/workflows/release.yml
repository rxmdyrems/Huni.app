name: Bump to new version
on:
  push:
    branches:
      - "main"
    paths:
      - "app/build.gradle.kts"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    if: "!contains(github.ref, 'refs/tags')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version_changed: ${{ steps.check_version.outputs.version_changed }}
      new_version: ${{ steps.check_version.outputs.new_version }}
      version_code: ${{ steps.check_version.outputs.version_code }}
    steps:
      # Only HEAD and HEAD^ are read below, and no submodule or Gradle work
      # happens in this job.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: check_version
        run: |
          if [ ! -f app/build.gradle.kts ]; then
            echo "File app/build.gradle.kts does not exist"
            echo "version_changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          NEW_VERSION=$(grep -m1 -oP '^\s*versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "")
          VERSION_CODE=$(grep -m1 -oP '^\s*versionCode\s*=\s*\K\d+' app/build.gradle.kts || echo "")

          if [ -z "$NEW_VERSION" ]; then
            echo "Could not find versionName in app/build.gradle.kts"
            echo "version_changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Current version: $NEW_VERSION (code: $VERSION_CODE)"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual release requested for version $NEW_VERSION"
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
            exit 0
          fi

          if git show HEAD^:app/build.gradle.kts > /dev/null 2>&1; then
            OLD_VERSION=$(git show HEAD^:app/build.gradle.kts | grep -m1 -oP '^\s*versionName\s*=\s*"\K[^"]+' || echo "")
            echo "Previous version: $OLD_VERSION"
            
            if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
              echo "Version changed from $OLD_VERSION to $NEW_VERSION"
              echo "version_changed=true" >> $GITHUB_OUTPUT
              echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
              echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
            else
              echo "Version unchanged: $NEW_VERSION"
              echo "version_changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "First version detected: $NEW_VERSION"
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          fi

      - name: Debug output
        run: |
          echo "Debug Information:"
          echo "  - version_changed: ${{ steps.check_version.outputs.version_changed }}"
          echo "  - new_version: ${{ steps.check_version.outputs.new_version }}"
          echo "  - version_code: ${{ steps.check_version.outputs.version_code }}"
          echo "  - event_name: ${{ github.event_name }}"

  build:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - variant: foss
            variantName: Foss
          - variant: gms
            variantName: Gms
          - variant: izzy
            variantName: Izzy

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Read-only: release builds reuse the dependency and build caches
          # written by main without publishing entries of their own.
          cache-read-only: true
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # No `clean`: the runner is ephemeral, so there is nothing to clean and
      # it only discards restored cache entries.
      - name: Build Release APK
        run: ./gradlew --console=plain assemble${{ matrix.variantName }}Release --warning-mode summary
        env:
          METROLIST_APP_NAME: Huni
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          # (CrashReporter.isEnabledSafe), so shipped builds report nothing.

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$RUNNER_TEMP/huni-release.keystore"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"
          UNSIGNED_APK=$(find "app/build/outputs/apk/${{ matrix.variant }}/release" -maxdepth 1 -type f -name '*unsigned*.apk' -print -quit)
          test -n "$UNSIGNED_APK"
          SIGNED_APK="${UNSIGNED_APK%-unsigned.apk}-signed.apk"
          "$APKSIGNER" sign --ks "$KEYSTORE_FILE" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out "$SIGNED_APK" "$UNSIGNED_APK"

      - name: Move and rename signed APKs
        run: |
          OUTPUT_DIR="app/build/outputs/apk/${{ matrix.variant }}/release"
          mkdir -p "$OUTPUT_DIR/out"

          SIGNED_APK=$(find "$OUTPUT_DIR" -name "*-signed.apk" -o -name "*-unsigned-signed.apk" | head -1)

          if [ -z "$SIGNED_APK" ]; then
            echo "No signed APK found for ${{ matrix.variant }}"
            ls -la "$OUTPUT_DIR"
            exit 1
          fi

          if [ "${{ matrix.variant }}" = "gms" ]; then
            TARGET_NAME="Huni-with-Google-Cast.apk"
          elif [ "${{ matrix.variant }}" = "izzy" ]; then
            TARGET_NAME="Huni-izzy.apk"
          else
            TARGET_NAME="Huni.apk"
          fi

          mv "$SIGNED_APK" "$OUTPUT_DIR/out/$TARGET_NAME"
          (cd "$OUTPUT_DIR/out" && sha256sum "$TARGET_NAME" > "$TARGET_NAME.sha256")

          echo "APK renamed to: $TARGET_NAME"
          ls -la "$OUTPUT_DIR/out/"

      - name: Verify release APK identity and signing certificate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="app/build/outputs/apk/${{ matrix.variant }}/release/out"
          if [ "${{ matrix.variant }}" = "gms" ]; then
            APK_PATH="$OUTPUT_DIR/Huni-with-Google-Cast.apk"
          elif [ "${{ matrix.variant }}" = "izzy" ]; then
            APK_PATH="$OUTPUT_DIR/Huni-izzy.apk"
          else
            APK_PATH="$OUTPUT_DIR/Huni.apk"
          fi

          STABLE_DIR="$RUNNER_TEMP/huni-stable"
          mkdir -p "$STABLE_DIR"
          gh release download v0.9.10 --repo "$GITHUB_REPOSITORY" \
            --pattern "Huni-0.9.10.apk" --dir "$STABLE_DIR"
          STABLE_APK="$STABLE_DIR/Huni-0.9.10.apk"

          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$AAPT"
          test -x "$APKSIGNER"
          BADGING=$("$AAPT" dump badging "$APK_PATH")
          PACKAGE=$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)
          VERSION_CODE=$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='[^']*' versionCode='\\([^']*\\)'.*/\\1/p" | head -n 1)
          if [ "$PACKAGE" != "com.remycamiguel.huni" ]; then
            echo "::error::Release APK package ID is not com.remycamiguel.huni"
            exit 1
          fi
          if [ "$VERSION_CODE" != "37" ]; then
            echo "::error::Release APK versionCode is not 37"
            exit 1
          fi

          cert_sha256() {
            "$APKSIGNER" verify --print-certs "$1" 2>&1 \
              | sed -n 's/.*certificate SHA-256 digest: //p' \
              | head -n 1 | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]'
          }
          STABLE_CERT=$(cert_sha256 "$STABLE_APK")
          RELEASE_CERT=$(cert_sha256 "$APK_PATH")
          if [ -z "$STABLE_CERT" ] || [ "$RELEASE_CERT" != "$STABLE_CERT" ]; then
            echo "::error::Release APK signing certificate does not match v0.9.10 stable"
            exit 1
          fi
          echo "Verified production package, versionCode, and stable signing certificate."

      - name: Upload Signed APKs
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.variant == 'gms' && 'Huni-with-Google-Cast' || matrix.variant == 'izzy' && 'Huni-izzy' || 'Huni' }}
          path: app/build/outputs/apk/${{ matrix.variant }}/release/out/*

  create-release:
    needs: [check-version, build]
    if: needs.check-version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all APKs
        uses: actions/download-artifact@v7
        with:
          path: downloaded_artifacts/

      - name: Organize APKs for release
        run: |
          echo "Organizing APK files..."
          mkdir -p release_files

          find downloaded_artifacts -type f \( -name "*.apk" -o -name "*.apk.sha256" \) -exec cp {} release_files/ \;

          echo "APKs ready for release:"
          ls -la release_files/

      - name: Parse release notes from changelog
        run: |
          VERSION="${{ needs.check-version.outputs.new_version }}"
          chmod +x .github/scripts/parse_changelog.sh

          if bash .github/scripts/parse_changelog.sh "$VERSION" CHANGELOG.md > release_notes.md; then
            echo "Release notes sourced from CHANGELOG.md for v$VERSION"
            echo "--- Preview (first 20 lines) ---"
            head -20 release_notes.md
          else
            echo "::error::v$VERSION is missing from CHANGELOG.md; refusing to create an unreviewed release note"
            exit 1
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Creating release v${{ needs.check-version.outputs.new_version }}"

          TAG="v${{ needs.check-version.outputs.new_version }}"
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists; refusing to move it"
            exit 1
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

          gh release create "$TAG" \
            --title "Huni v${{ needs.check-version.outputs.new_version }}" \
            --notes-file release_notes.md \
            --verify-tag \
            --draft \
            --target "$GITHUB_SHA" \
            --latest=false \
            release_files/*

          echo "Release created successfully!"

      - name: Update release summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: v${{ needs.check-version.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Code**: ${{ needs.check-version.outputs.version_code }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Released by**: @${{ github.triggering_actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APKs Built**: $(ls release_files/*.apk | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- **Release URL**: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.check-version.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
