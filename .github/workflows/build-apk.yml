name: Build and Sign Huni APK

on:
  push:
    branches:
      - redesign-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install project Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Foss release APK
        run: ./gradlew assembleFossRelease --console=plain -q
        env:
          METROLIST_APPLICATION_ID: com.remycamiguel.huni
          METROLIST_APP_NAME: Huni

      - name: Sign APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/foss/release/
          signingKey: ${{ secrets.KEYSTORE_BASE64 }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 37.0.0

      - name: Rename APK and create checksum
        run: |
          OUTPUT_DIR="app/build/outputs/apk/foss/release"
          mkdir -p "$OUTPUT_DIR/out"
          SIGNED_APK=$(find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*-signed.apk' -print -quit)
          test -n "$SIGNED_APK"
          mv "$SIGNED_APK" "$OUTPUT_DIR/out/Huni-0.9.3.apk"
          sha256sum "$OUTPUT_DIR/out/Huni-0.9.3.apk" > "$OUTPUT_DIR/out/Huni-0.9.3.apk.sha256"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: huni-0.9.3-foss-universal
          path: app/build/outputs/apk/foss/release/out/*
          if-no-files-found: error
          retention-days: 30
