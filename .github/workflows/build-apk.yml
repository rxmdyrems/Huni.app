name: Build and Sign Huni APK

on:
  push:
    branches:
      - redesign-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install project Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Foss release APK
        run: ./gradlew assembleFossRelease --console=plain -q
        env:
          METROLIST_APPLICATION_ID: com.remycamiguel.huni
          METROLIST_APP_NAME: Huni

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          KEYSTORE_FILE="$RUNNER_TEMP/huni-release.keystore"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"
          UNSIGNED_APK=$(find app/build/outputs/apk/foss/release -maxdepth 1 -type f -name '*unsigned*.apk' -print -quit)
          test -n "$UNSIGNED_APK"
          SIGNED_APK="${UNSIGNED_APK%-unsigned.apk}-signed.apk"
          "$APKSIGNER" sign --ks "$KEYSTORE_FILE" --ks-pass "pass:$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" --out "$SIGNED_APK" "$UNSIGNED_APK"

      - name: Rename APK and create checksum
        run: |
          OUTPUT_DIR="app/build/outputs/apk/foss/release"
          mkdir -p "$OUTPUT_DIR/out"
          SIGNED_APK=$(find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*-signed.apk' -print -quit)
          test -n "$SIGNED_APK"
          mv "$SIGNED_APK" "$OUTPUT_DIR/out/Huni-0.9.3.apk"
          sha256sum "$OUTPUT_DIR/out/Huni-0.9.3.apk" > "$OUTPUT_DIR/out/Huni-0.9.3.apk.sha256"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: huni-0.9.3-foss-universal
          path: app/build/outputs/apk/foss/release/out/*
          if-no-files-found: error
          retention-days: 30
